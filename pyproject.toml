[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ransomwatch"
version = "0.1.0"
description = "Local, explainable ransomware-behavior monitoring for Windows and Linux."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "zmahxx" }]
dependencies = [
  "fastapi>=0.116,<1",
  "psutil>=7.0,<8",
  "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "types-psutil>=7,<8",
]

[project.scripts]
ransomwatch = "ransomwatch.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ransomwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ransomwatch"]

